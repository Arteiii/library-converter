name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: pioneer_converter
            asset_name: pioneer_converter-linux-amd64
            features: ""

          - os: windows-latest
            artifact_name: pioneer_converter.exe
            asset_name: pioneer_converter-windows-amd64.exe
            features: ""
          - os: windows-latest
            artifact_name: pioneer_converter.exe
            asset_name: pioneer_converter-ffmpeg-windows-amd64.exe
            features: "--features ffmpeg --no-default-features"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release ${{ matrix.features }}

      - name: Package Assets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir dist
          cp target/release/${{ matrix.artifact_name }} dist/
          cp LICENSE-FOUL dist/
          cd dist && tar -czvf ../${{ matrix.asset_name }}.tar.gz *

      - name: Package Assets (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir dist
          copy target\release\${{ matrix.artifact_name }} dist\
          copy LICENSE-FOUL dist\
          powershell Compress-Archive -Path dist\* -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            *.tar.gz
            *.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./assets
          merge-multiple: true

      - name: Generate Release Readme
        run: |
          cat <<EOF > RELEASE_INFO.md
          # Release ${{ github.ref_name }}

          ### 🛠 Available Downloads

          Please choose the appropriate version for your system (**Windows** or **Linux**).

          | Build | Engine | Focus | Metadata Support |
          | :--- | :--- | :--- | :--- |
          | **ffmpeg-build** | FFmpeg (Bundled) | Stability & Safety | ✅ Full (Tags/Covers) |
          | **standard-build** | Pure Rust | Performance & Lightweight | ⚠️ Limited |

          #### Version Details:
          - **FFmpeg Version:** Highly recommended for better stability and safety. FFmpeg is bundled—it is stored in temporary files and managed automatically. No manual installation is required.
          - **Standard Version:** Pure Rust implementation. Offers better performance and does not rely on external tooling, but metadata/tags might not work as intended.

          ---
          *Build generated on $(date -u +'%Y-%m-%d %H:%M UTC')*
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_INFO.md
          files: ./assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
